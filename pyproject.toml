[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guance"
version = "0.1.0"
description = "Windows Daguandan state assistant with local FableDan recommendations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "PySide6==6.11.1",
  "PyInstaller==6.21.0",
  "pywin32==311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not local_capture'"
markers = [
  "unit: fast isolated tests",
  "integration: multi-component tests",
  "windows_integration: requires Windows desktop facilities",
  "local_capture: explicit private local-capture acceptance; never skipped when selected",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
